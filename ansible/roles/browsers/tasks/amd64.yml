---
# Google Chrome is always available for amd64
- name: Check if Google Chrome is installed
  ansible.builtin.command: which google-chrome
  register: chrome_check
  changed_when: false
  failed_when: false

- name: Download Google Chrome .deb
  ansible.builtin.get_url:
    url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
    dest: /tmp/chrome.deb
    mode: "0644"
  when: chrome_check.rc != 0

- name: Install Google Chrome
  ansible.builtin.apt:
    deb: /tmp/chrome.deb
  when: chrome_check.rc != 0

- name: Remove Chrome installer
  ansible.builtin.file:
    path: /tmp/chrome.deb
    state: absent
