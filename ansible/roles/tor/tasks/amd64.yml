---
# Download official stable release directly (torbrowser-launcher is just a stub)
- name: Check if Tor Browser is already installed
  ansible.builtin.stat:
    path: /opt/tor-browser
  register: tor_browser_dir

- name: Get latest Tor Browser stable version
  ansible.builtin.shell:
    cmd: |
      curl -fsSL "https://dist.torproject.org/torbrowser/" \
        | grep -oP 'href="\K[0-9]+\.[0-9]+(\.[0-9]+)*(?=/)' \
        | sort -V | tail -1
  register: tor_stable_version
  changed_when: false
  failed_when: false
  when: not tor_browser_dir.stat.exists

- name: Download Tor Browser stable
  ansible.builtin.get_url:
    url: "https://dist.torproject.org/torbrowser/{{ tor_stable_version.stdout }}/tor-browser-linux-x86_64-{{ tor_stable_version.stdout }}.tar.xz"
    dest: /tmp/tor-browser-stable.tar.xz
    mode: "0644"
  when:
    - not tor_browser_dir.stat.exists
    - (tor_stable_version.stdout | default('')) | length > 0

- name: Create Tor Browser directory
  ansible.builtin.file:
    path: /opt/tor-browser
    state: directory
    mode: "0755"
  when:
    - not tor_browser_dir.stat.exists
    - (tor_stable_version.stdout | default('')) | length > 0

- name: Extract Tor Browser stable
  ansible.builtin.unarchive:
    src: /tmp/tor-browser-stable.tar.xz
    dest: /opt/tor-browser
    remote_src: true
    extra_opts: ['--strip-components=1']
  when:
    - not tor_browser_dir.stat.exists
    - (tor_stable_version.stdout | default('')) | length > 0

- name: Set Tor Browser ownership
  ansible.builtin.file:
    path: /opt/tor-browser
    state: directory
    recurse: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
  when:
    - not tor_browser_dir.stat.exists
    - (tor_stable_version.stdout | default('')) | length > 0

- name: Clean up Tor Browser tarball
  ansible.builtin.file:
    path: /tmp/tor-browser-stable.tar.xz
    state: absent

- name: Deploy Tor Browser desktop entry
  ansible.builtin.template:
    src: tor-browser.desktop.j2
    dest: /usr/share/applications/tor-browser.desktop
    mode: "0644"

- name: Update desktop database
  ansible.builtin.command: update-desktop-database /usr/share/applications
  changed_when: false
  failed_when: false

- name: Find Tor Browser desktop file
  ansible.builtin.shell:
    cmd: "find /usr/share/applications -maxdepth 1 -name 'tor-browser.desktop' -printf '%f\\n' 2>/dev/null | head -1"
  register: tor_desktop
  changed_when: false

- name: Add Tor Browser to Whisker menu favorites
  ansible.builtin.lineinfile:
    path: "{{ whisker_defaults }}"
    regexp: '^(favorites=(?!.*tor-browser\.desktop).*)$'
    line: '\1,tor-browser.desktop'
    backrefs: true
  when:
    - whisker_stat.stat.exists
    - tor_desktop.stdout | length > 0
