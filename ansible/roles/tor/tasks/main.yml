---
- name: Install Tor proxy
  ansible.builtin.apt:
    name: tor
    state: present

# ===========================================================
# AMD64 – torbrowser-launcher aus dem Repository
# ===========================================================
- name: Install Torbrowser Launcher (amd64)
  ansible.builtin.apt:
    name: torbrowser-launcher
    state: present
  when: dpkg_arch == 'amd64'

- name: Find Tor Browser desktop file (amd64)
  ansible.builtin.shell:
    cmd: "find /usr/share/applications -maxdepth 1 -name '*torbrowser*' -printf '%f\\n' 2>/dev/null | head -1"
  register: tor_desktop_amd64
  changed_when: false
  when: dpkg_arch == 'amd64'

- name: Add Tor Browser to Whisker menu (amd64)
  ansible.builtin.lineinfile:
    path: "{{ whisker_defaults }}"
    regexp: '^(favorites=(?!.*{{ tor_desktop_amd64.stdout }}).*)$'
    line: '\1,{{ tor_desktop_amd64.stdout }}'
    backrefs: true
  when:
    - dpkg_arch == 'amd64'
    - whisker_stat.stat.exists
    - tor_desktop_amd64.stdout | default('') | length > 0

# ===========================================================
# ARM64 – Nightly-Build manuell installieren
# ===========================================================
- name: Check if Tor Browser is already installed (arm64)
  ansible.builtin.stat:
    path: /opt/tor-browser
  register: tor_browser_dir
  when: dpkg_arch != 'amd64'

- name: Get latest Tor Browser nightly date (arm64)
  ansible.builtin.shell:
    cmd: |
      curl -fsSL "https://nightlies.tbb.torproject.org/nightly-builds/tor-browser-builds/" \
        | grep -oP 'tbb-nightly\.\K[0-9]{4}\.[0-9]{2}\.[0-9]{2}' \
        | sort -r | head -1
  register: tor_nightly_date
  changed_when: false
  failed_when: false
  when:
    - dpkg_arch != 'amd64'
    - not (tor_browser_dir.stat.exists | default(false))

- name: Download Tor Browser nightly (arm64)
  ansible.builtin.get_url:
    url: "https://nightlies.tbb.torproject.org/nightly-builds/tor-browser-builds/tbb-nightly.{{ tor_nightly_date.stdout }}/nightly-linux-aarch64/tor-browser-linux-aarch64-tbb-nightly.{{ tor_nightly_date.stdout }}.tar.xz"
    dest: /tmp/tor-browser-nightly.tar.xz
    mode: "0644"
  when:
    - dpkg_arch != 'amd64'
    - not (tor_browser_dir.stat.exists | default(false))
    - (tor_nightly_date.stdout | default('')) | length > 0

- name: Create Tor Browser directory (arm64)
  ansible.builtin.file:
    path: /opt/tor-browser
    state: directory
    mode: "0755"
  when:
    - dpkg_arch != 'amd64'
    - not (tor_browser_dir.stat.exists | default(false))
    - (tor_nightly_date.stdout | default('')) | length > 0

- name: Extract Tor Browser nightly (arm64)
  ansible.builtin.unarchive:
    src: /tmp/tor-browser-nightly.tar.xz
    dest: /opt/tor-browser
    remote_src: true
    extra_opts: ['--strip-components=1']
  when:
    - dpkg_arch != 'amd64'
    - not (tor_browser_dir.stat.exists | default(false))
    - (tor_nightly_date.stdout | default('')) | length > 0

- name: Set Tor Browser ownership (arm64)
  ansible.builtin.file:
    path: /opt/tor-browser
    state: directory
    recurse: true
    owner: "{{ setup_user }}"
    group: "{{ setup_user }}"
  when:
    - dpkg_arch != 'amd64'
    - not (tor_browser_dir.stat.exists | default(false))
    - (tor_nightly_date.stdout | default('')) | length > 0

- name: Clean up Tor Browser tarball (arm64)
  ansible.builtin.file:
    path: /tmp/tor-browser-nightly.tar.xz
    state: absent
  when: dpkg_arch != 'amd64'

- name: Deploy Tor Browser desktop entry (arm64)
  ansible.builtin.template:
    src: tor-browser.desktop.j2
    dest: /usr/share/applications/tor-browser.desktop
    mode: "0644"
  when: dpkg_arch != 'amd64'

- name: Update desktop database (arm64)
  ansible.builtin.command: update-desktop-database /usr/share/applications
  changed_when: false
  failed_when: false
  when: dpkg_arch != 'amd64'

- name: Add Tor Browser to Whisker menu (arm64)
  ansible.builtin.lineinfile:
    path: "{{ whisker_defaults }}"
    regexp: '^(favorites=(?!.*tor-browser\.desktop).*)$'
    line: '\1,tor-browser.desktop'
    backrefs: true
  when:
    - dpkg_arch != 'amd64'
    - whisker_stat.stat.exists
