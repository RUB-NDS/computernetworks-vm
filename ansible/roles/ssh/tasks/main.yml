---
- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Permit root login with password
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin'
    line: 'PermitRootLogin yes'
  notify: Restart SSH

- name: Enable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication'
    line: 'PasswordAuthentication yes'
  notify: Restart SSH

- name: Enable and start SSH service (ssh)
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
  register: ssh_service
  failed_when: false

- name: Enable and start SSH service (sshd fallback)
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  when: ssh_service is failed
