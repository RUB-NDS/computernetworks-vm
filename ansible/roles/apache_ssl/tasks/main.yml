---
- name: Install Apache
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ course_cert_dir }}"
    state: directory
    mode: "0755"

- name: Check if CA certificate exists
  ansible.builtin.stat:
    path: "{{ course_cert_dir }}/ca.crt"
  register: ca_cert_stat

- name: Check if server certificate exists
  ansible.builtin.stat:
    path: "{{ course_cert_dir }}/server.crt"
  register: srv_cert_stat

# --- PKI generation (only when certs don't exist) ---
- name: Generate Root CA key and certificate
  ansible.builtin.command: >
    openssl req -x509 -nodes -days 825 -newkey rsa:2048
    -keyout {{ course_cert_dir }}/ca.key
    -out {{ course_cert_dir }}/ca.crt
    -subj "/C=DE/ST=NRW/O={{ course_org }}/CN={{ course_ca_name }}"
    -addext "basicConstraints=critical,CA:TRUE"
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Deploy OpenSSL SAN config
  ansible.builtin.template:
    src: openssl-san.cnf.j2
    dest: /tmp/openssl-san.cnf
    mode: "0644"
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Deploy OpenSSL extensions config
  ansible.builtin.template:
    src: openssl-ext.cnf.j2
    dest: /tmp/openssl-ext.cnf
    mode: "0644"
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Generate server CSR
  ansible.builtin.command: >
    openssl req -new -nodes -newkey rsa:2048
    -keyout {{ course_cert_dir }}/server.key
    -out /tmp/server.csr
    -config /tmp/openssl-san.cnf
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Sign server certificate with CA
  ansible.builtin.command: >
    openssl x509 -req -days 825
    -in /tmp/server.csr
    -CA {{ course_cert_dir }}/ca.crt
    -CAkey {{ course_cert_dir }}/ca.key
    -CAcreateserial
    -out {{ course_cert_dir }}/server.crt
    -extfile /tmp/openssl-ext.cnf
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Set certificate file permissions (public)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0644"
  loop:
    - "{{ course_cert_dir }}/ca.crt"
    - "{{ course_cert_dir }}/server.crt"
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Set key file permissions (private)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - "{{ course_cert_dir }}/ca.key"
    - "{{ course_cert_dir }}/server.key"
  when: not ca_cert_stat.stat.exists or not srv_cert_stat.stat.exists

- name: Clean up temporary OpenSSL files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/openssl-san.cnf
    - /tmp/openssl-ext.cnf
    - /tmp/server.csr
    - "{{ course_cert_dir }}/ca.srl"

# --- Apache configuration ---
- name: Deploy Apache SSL vhost
  ansible.builtin.template:
    src: vhost-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ course_id }}-ssl.conf"
    mode: "0644"
  notify: Restart Apache

- name: Enable SSL module
  ansible.builtin.command: a2enmod ssl
  register: enable_ssl_mod
  changed_when: "'Enabling module' in enable_ssl_mod.stdout"
  notify: Restart Apache

- name: Disable default-ssl site
  ansible.builtin.command: a2dissite default-ssl
  register: disable_default_ssl
  changed_when: "'Site default-ssl disabled' in disable_default_ssl.stdout"
  failed_when: false
  notify: Restart Apache

- name: Enable course SSL site
  ansible.builtin.command: "a2ensite {{ course_id }}-ssl"
  register: enable_course_site
  changed_when: "'Enabling site' in enable_course_site.stdout"
  notify: Restart Apache

- name: Enable Apache at boot
  ansible.builtin.systemd:
    name: apache2
    enabled: true
